name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for scripts
        run: chmod +x ./gradlew ./scripts/test.sh ./scripts/build.sh

      - name: test
        run: ./scripts/test.sh

      - name: Generate JaCoCo coverage report
        run: ./gradlew :app:jacocoTestReport --no-daemon

      - name: Verify coverage threshold
        run: ./gradlew :app:jacocoTestCoverageVerification --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/jacocoTestReport/
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for scripts
        run: chmod +x ./gradlew ./scripts/build.sh

      - name: build
        run: ./scripts/build.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Run ktlint
        run: ./gradlew ktlintCheck --no-daemon

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
